name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.13"
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/polsales
      SESSION_SECRET: ci-secret
      PYTHONUTF8: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Linux: PostgreSQL 16 as a service container.
      - name: Start PostgreSQL (Linux)
        if: runner.os == 'Linux'
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=polsales \
            -p 5432:5432 --health-cmd "pg_isready -U postgres -d polsales" \
            --health-interval 2s --health-retries 30 postgres:16
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' pg)" = "healthy" ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' pg

      # Windows: the PostgreSQL preinstalled on the runner image (no Docker for Linux images there).
      - name: Start PostgreSQL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $svc = Get-Service -Name "postgresql*" | Select-Object -First 1
          Set-Service -Name $svc.Name -StartupType Manual
          Start-Service -Name $svc.Name
          $env:PGPASSWORD = "root"
          & "$env:PGBIN\psql.exe" -U postgres -h 127.0.0.1 -c "ALTER USER postgres PASSWORD 'postgres';"
          $env:PGPASSWORD = "postgres"
          & "$env:PGBIN\createdb.exe" -U postgres -h 127.0.0.1 polsales

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend (with dev extras and polanon)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint and format (backend, tools and evals)
        run: ruff check --output-format=github . ../tools ../evals && ruff format --check . ../tools ../evals

      - name: Type-check (mypy, settings in pyproject.toml)
        run: mypy

      - name: Apply migrations
        run: alembic upgrade head

      # The coverage floor is fail_under in pyproject.toml: below it this step fails.
      - name: Run tests with coverage (warnings are errors)
        run: pytest -q -W error --cov --cov-report=term-missing

  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Node that frontend/Dockerfile builds the panel with.
      - name: Set up Node 26 (LTS)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Tests (vitest)
        run: npm test

      # The app and the Vite config (tsconfig.node.json), on their own so a type error is named.
      - name: Typecheck
        run: npm run typecheck

      # npm run build is the typecheck above and then this.
      - name: Build
        run: npx vite build
