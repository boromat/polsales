# Keeps the workflow actions and the Docker base images current. The actions are pinned to a
# commit, with the release in a comment, so a moved tag cannot change what runs; Dependabot updates
# both. The Python and npm dependencies are left out on purpose: pyproject.toml and package.json
# pin lower bounds or ranges, and Dependabot's vulnerability alerts cover the versions in use.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Every action update in one pull request, rather than one pull request per action.
    groups:
      actions:
        patterns: ["*"]
  # backend/Dockerfile (python) and frontend/Dockerfile (node, then caddy).
  - package-ecosystem: docker
    directories: ["/backend", "/frontend"]
    schedule:
      interval: monthly
    ignore:
      # google-ads, which the google extra installs for Google Ads, requires Python <3.15 in every
      # release up to 35.1.0 (November 2026), so an image on 3.15 cannot be built with that extra.
      # Remove this once google-ads supports Python 3.15.
      - dependency-name: "python"
        versions: [">= 3.15"]
